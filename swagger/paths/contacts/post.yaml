patch:
  tags:
    - Contacts
  summary: Update a contact
  operationId: updateContact
  description: Update an existing contact's information by its ID.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      description: ID of the contact to update
      schema:
        type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
            phoneNumber:
              type: string
            contactType:
              type: string
              enum: [personal, business]
            photo:
              type: string
              format: binary
  responses:
    '200':
      description: Contact successfully updated
    '400':
      description: Bad request
    '401':
      description: Unauthorized
    '404':
      description: Contact not found
