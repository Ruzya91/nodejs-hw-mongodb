openapi: 3.0.3
info:
  title: Contacts API
  version: 1.0.0
  description: API for managing contacts
  contact:
    name: API Support
    email: support@example.com
servers:
  - url: https://nodejs-hw-mongodb-7-ye1v.onrender.com
    description: Deployed server
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Contacts
    description: Operations related to managing contacts

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PaginationResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Successfully found contacts!
        data:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Contact'
            page:
              type: integer
              example: 1
            perPage:
              type: integer
              example: 10
            totalItems:
              type: integer
              example: 45
            totalPages:
              type: integer
              example: 5
            hasPreviousPage:
              type: boolean
              example: false
            hasNextPage:
              type: boolean
              example: true

    ContactResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Contact successfully retrieved
        data:
          $ref: '#/components/schemas/Contact'

    CreateContactResponse:
      type: object
      properties:
        status:
          type: integer
          example: 201
        message:
          type: string
          example: Contact successfully created
        data:
          $ref: '#/components/schemas/Contact'

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Bad request
        data:
          type: object
          example: {}

    Contact:
      type: object
      properties:
        _id:
          type: string
          example: 64c5f75ef1a7a9c001234567
        name:
          type: string
          example: John Doe
        phoneNumber:
          type: string
          example: '+1234567890'
        email:
          type: string
          example: john@example.com
        isFavourite:
          type: boolean
          example: true
        contactType:
          type: string
          enum: [work, home, personal]
        photo:
          type: string
          example: 'https://example.com/photo.jpg'

paths:
  /contacts:
    get:
      tags:
        - Contacts
      summary: Get all contacts
      description: Retrieve a list of all contacts with optional filters, sorting and pagination.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: perPage
          in: query
          schema:
            type: integer
            default: 10
          description: Number of contacts per page
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, email, contactType, isFavourite]
          description: Field to sort by
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sort order
        - name: contactType
          in: query
          schema:
            type: string
            enum: [work, home, personal]
          description: Filter contacts by type
        - name: isFavourite
          in: query
          schema:
            type: boolean
          description: Filter contacts by favourite status
      responses:
        '200':
          description: Successfully retrieved contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginationResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Contacts
      summary: Create a new contact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, phoneNumber, contactType]
              properties:
                name:
                  type: string
                phoneNumber:
                  type: string
                email:
                  type: string
                isFavourite:
                  type: boolean
                contactType:
                  type: string
                  enum: [work, home, personal]
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Contact successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateContactResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /contacts/{contactId}:
    get:
      tags:
        - Contacts
      summary: Get a contact by ID
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contact found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Contacts
      summary: Update a contact by ID
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                phoneNumber:
                  type: string
                email:
                  type: string
                isFavourite:
                  type: boolean
                contactType:
                  type: string
                  enum: [work, home, personal]
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Contacts
      summary: Delete a contact by ID
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Contact successfully deleted
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
