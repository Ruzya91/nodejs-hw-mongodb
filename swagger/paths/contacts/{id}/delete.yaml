delete:
  tags:
    - Contacts
  summary: Delete a contact
  operationId: deleteContact
  description: Remove a contact from the database by its ID.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      description: ID of the contact to delete
      schema:
        type: string
  responses:
    '200':
      description: Contact successfully deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Contact successfully deleted
              data:
                nullable: true
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized
              data:
                nullable: true
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Contact not found
              data:
                nullable: true
