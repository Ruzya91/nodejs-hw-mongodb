post:
  tags:
    - Contacts
  summary: Create a new contact
  operationId: createContact
  description: Add a new contact to the database.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
            phoneNumber:
              type: string
            contactType:
              type: string
              enum: [personal, business]
            photo:
              type: string
              format: binary
  responses:
    '201':
      description: Contact successfully created
    '400':
      description: Bad request
    '401':
      description: Unauthorized
