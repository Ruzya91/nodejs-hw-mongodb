get:
  tags:
    - Contacts
  summary: Get all contacts
  operationId: getAllContacts
  description: Retrieve a list of contacts from the database, with optional filtering.
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      required: false
      description: Page number for pagination
      schema:
        type: integer
        example: 1
    - name: limit
      in: query
      required: false
      description: Number of results per page
      schema:
        type: integer
        example: 10
    - name: contactType
      in: query
      required: false
      description: Filter contacts by type
      schema:
        type: string
        enum: [personal, business]
  responses:
    '200':
      description: Successful response
    '401':
      description: Unauthorized
